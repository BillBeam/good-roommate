# Zero-cost probe of the session -> Actions -> Compshare chain. Triggers: manual,
# or a push to the dedicated chain-request branch (and only that branch).
# Never pull_request / issue_comment or other events outsiders can cause.
# Read-only Compshare calls; results go to the chain-results branch and, if a PR
# number is given, a short comment on that PR.
# Push runs take their inputs from ops/probe_request.json in the
# triggering commit (the session's GitHub token cannot dispatch workflows).
name: chain-probe

on:
  workflow_dispatch:
    inputs:
      dispatched_at:
        description: "UTC time the caller dispatched this run (ISO 8601), for timing"
        required: false
        default: ""
      pr_number:
        description: "PR to post a summary comment on (optional)"
        required: false
        default: ""
  push:
    branches: [chain-request]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chain-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: req
        env:
          IN_DISPATCHED_AT: ${{ inputs.dispatched_at }}
          IN_PR: ${{ inputs.pr_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ -f ops/probe_request.json ]; then
            python3 -c "import json;d=json.load(open('ops/probe_request.json'));print('dispatched_at='+d.get('requested_at',''));print('pr_number='+str(d.get('pr_number','')))" >> "$GITHUB_OUTPUT"
          else
            echo "dispatched_at=$IN_DISPATCHED_AT" >> "$GITHUB_OUTPUT"
            echo "pr_number=$IN_PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe (read-only)
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          DISPATCHED_AT: ${{ steps.req.outputs.dispatched_at }}
        run: python3 ops/chain_probe.py "$RUNNER_TEMP/out"

      - name: Push results to chain-results branch
        env:
          OUT: ${{ runner.temp }}/out
        run: |
          dest="runs/chain/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin chain-results; then
            git switch -c chain-results FETCH_HEAD
          else
            git switch --orphan chain-results
          fi
          mkdir -p "$dest" && cp -r "$OUT"/. "$dest"/
          git add "$dest"
          git commit -q -m "chain-probe results for run ${GITHUB_RUN_ID}"
          git push origin chain-results

      - name: Comment on PR
        if: steps.req.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          PR: ${{ steps.req.outputs.pr_number }}
        run: |
          {
            echo "chain-probe run ${GITHUB_RUN_ID} finished $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Results: \`runs/chain/${GITHUB_RUN_ID}/result.json\` on branch \`chain-results\`."
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('$OUT/result.json'));print(json.dumps({'checks':d.get('compshare',{}).get('checks'),'ssh':[{k:r.get(k) for k in ('host','handshake_ok','tcp_connect_median_ms')} for r in d.get('ssh',[])]},ensure_ascii=False,indent=1))"
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
