# Relay between the cloud session and Compshare. Triggers: manual, or a push to the
# dedicated chain-request branch (and only that branch). Never pull_request /
# issue_comment or other events outsiders can cause.
# Push runs take their inputs from ops/probe_request.json in the triggering commit
# (the session's GitHub token cannot dispatch workflows):
#   mode "probe" (default): read-only checks, results to chain-results.
#   mode "grab": wait for a suitable GPU, run ops/gpu_remote_check.py on it, destroy it.
#   mode "stop": no-op; a running grab notices it and ends its window early.
#   mode "train": ops/train_relay.py runs the request's actions on the one training machine
#     (grab, heartbeat = platform shutdown 2 h after the request, upload, run, wait/sync, image, destroy).
#   mode "keepalive": same as "train" but in its own concurrency group, for short status/heartbeat
#     requests while a long "train" request is still running: foreground checks, sync, exposure,
#     token_check and the custom image (never upload or background jobs here).
#   mode "teacher": DeepSeek V4 Pro teacher trajectories on this runner (roommate.train.teacher);
#     the request cache and results go to the m2pilot-data branch so a rerun never pays twice.
# Results go to the chain-results branch and, if a PR number is given, a PR comment.
# Balance and charges are never written to either.
name: chain-probe

on:
  workflow_dispatch:
    inputs:
      dispatched_at:
        description: "UTC time the caller dispatched this run (ISO 8601), for timing"
        required: false
        default: ""
      pr_number:
        description: "PR to post a summary comment on (optional)"
        required: false
        default: ""
  push:
    branches: [chain-request]

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.req.outputs.mode }}
      dispatched_at: ${{ steps.req.outputs.dispatched_at }}
      pr_number: ${{ steps.req.outputs.pr_number }}
      window_minutes: ${{ steps.req.outputs.window_minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs
        id: req
        env:
          IN_DISPATCHED_AT: ${{ inputs.dispatched_at }}
          IN_PR: ${{ inputs.pr_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ -f ops/probe_request.json ]; then
            python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          d = json.load(open("ops/probe_request.json"))
          mode = d.get("mode", "probe")
          assert mode in ("probe", "grab", "stop", "train", "keepalive", "teacher"), mode
          print("mode=" + mode)
          print("dispatched_at=" + d.get("requested_at", ""))
          print("pr_number=" + (str(int(d["pr_number"])) if d.get("pr_number") else ""))
          print("window_minutes=" + str(min(300, int(d.get("window_minutes", 300)))))
          PY
          else
            echo "mode=probe" >> "$GITHUB_OUTPUT"
            echo "dispatched_at=$IN_DISPATCHED_AT" >> "$GITHUB_OUTPUT"
            echo "pr_number=$IN_PR" >> "$GITHUB_OUTPUT"
            echo "window_minutes=0" >> "$GITHUB_OUTPUT"
          fi

  probe:
    needs: plan
    if: needs.plan.outputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: chain-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Probe (read-only)
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          DISPATCHED_AT: ${{ needs.plan.outputs.dispatched_at }}
        run: python3 ops/chain_probe.py "$RUNNER_TEMP/out"

      - name: Push results to chain-results branch
        env:
          OUT: ${{ runner.temp }}/out
          DEST: runs/chain
        run: bash ops/push_results.sh

      - name: Comment on PR
        if: needs.plan.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          PR: ${{ needs.plan.outputs.pr_number }}
        run: |
          {
            echo "chain-probe run ${GITHUB_RUN_ID} finished $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Results: \`runs/chain/${GITHUB_RUN_ID}/result.json\` on branch \`chain-results\`."
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('$OUT/result.json'));print(json.dumps({'checks':{k:v for k,v in (d.get('compshare',{}).get('checks') or {}).items() if k!='balance'},'ssh':[{k:r.get(k) for k in ('host','handshake_ok','tcp_connect_median_ms')} for r in d.get('ssh',[])]},ensure_ascii=False,indent=1))"
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  grab:
    needs: plan
    if: needs.plan.outputs.mode == 'grab'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: gpu-grab
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass >/dev/null

      - name: Grab, test, destroy
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          GRAB_WINDOW_MINUTES: ${{ needs.plan.outputs.window_minutes }}
          GRAB_REQUEST_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/gpu_grab.py "$RUNNER_TEMP/out"

      - name: Push results to chain-results branch
        if: always()
        env:
          OUT: ${{ runner.temp }}/out
          DEST: runs/grab
        run: rm -rf "$OUT/_bundle" "$OUT/_bundle.tgz"; bash ops/push_results.sh

      - name: Comment on PR
        if: always() && needs.plan.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out
          PR: ${{ needs.plan.outputs.pr_number }}
        run: |
          {
            echo "gpu-grab run ${GITHUB_RUN_ID} finished $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Results: \`runs/grab/${GITHUB_RUN_ID}/\` on branch \`chain-results\`."
            echo
            echo '```json'
            python3 -c "import json;d=json.load(open('$OUT/result.json'));print(json.dumps({k:d.get(k) for k in ('outcome','machine','balance','remote_tests_ran','create_to_running_seconds','create_to_login_seconds','instance_lifetime_minutes','sweeps')},ensure_ascii=False,indent=1))" || echo '{"outcome": "no result.json"}'
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

  cleanup:
    needs: [plan, grab]
    if: always() && needs.plan.outputs.mode == 'grab'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Destroy any leftover gr-probe-* instance
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
        run: python3 ops/gpu_cleanup.py

  train:
    needs: plan
    if: needs.plan.outputs.mode == 'train'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: m2pilot-train
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass >/dev/null

      - name: Relay actions
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: python3 ops/train_relay.py "$RUNNER_TEMP/relay"

      - name: Keep checkpoints (artifact, 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2pilot-ckpt-${{ github.run_id }}
          path: ${{ runner.temp }}/relay/ckpt
          if-no-files-found: ignore
          retention-days: 90

  keepalive:
    needs: plan
    if: needs.plan.outputs.mode == 'keepalive'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: m2pilot-keepalive
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y -qq sshpass >/dev/null

      - name: Relay actions (status / heartbeat only)
        env:
          COMPSHARE_PUBLIC_KEY: ${{ secrets.COMPSHARE_PUBLIC_KEY }}
          COMPSHARE_PRIVATE_KEY: ${{ secrets.COMPSHARE_PRIVATE_KEY }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          RELAY_KEEPALIVE: "1"
        run: python3 ops/train_relay.py "$RUNNER_TEMP/relay"

  teacher:
    needs: plan
    if: needs.plan.outputs.mode == 'teacher'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: m2pilot-teacher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Restore earlier teacher results and request cache
        run: |
          if git fetch -q --depth=1 origin m2pilot-data; then
            git archive FETCH_HEAD runs/m2pilot/teacher 2>/dev/null | tar xf - || true
          fi

      - name: DeepSeek balance check (booleans only; stops below 60 CNY)
        id: dscheck
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request
          key = os.environ.get("DEEPSEEK_API_KEY", "")
          res = {"deepseek_key_present": bool(key)}
          if key:
              d = json.load(urllib.request.urlopen(urllib.request.Request(
                  "https://api.deepseek.com/user/balance", headers={"Authorization": f"Bearer {key}"}), timeout=30))
              cny = sum(float(b.get("total_balance") or 0) for b in d.get("balance_infos") or [] if b.get("currency") == "CNY")
              res["deepseek_available"] = bool(d.get("is_available"))
              res["deepseek_balance_ge_60_cny"] = cny >= 60
          os.makedirs("runs/m2pilot/teacher", exist_ok=True)
          json.dump(res, open("/tmp/dscheck.json", "w"))
          print(json.dumps(res))
          sys.exit(0 if res.get("deepseek_balance_ge_60_cny") else 1)
          PY

      - name: Teacher trajectories (DeepSeek V4 Pro)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          ( while sleep 900; do OUT=runs/m2pilot/teacher DEST=runs/m2pilot SRC=teacher bash ops/push_data.sh || true; done ) &
          python3 -c "import json;d=json.load(open('ops/probe_request.json'));print(d.get('teacher_args',''))" > /tmp/targs
          python3 -m roommate.train.teacher $(cat /tmp/targs)

      - name: Push teacher results to m2pilot-data
        if: always()
        run: OUT=runs/m2pilot/teacher DEST=runs/m2pilot SRC=teacher bash ops/push_data.sh

      - name: Comment on PR
        if: always() && needs.plan.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr_number }}
        run: |
          {
            echo "teacher run ${GITHUB_RUN_ID} finished $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "DeepSeek check: $(cat /tmp/dscheck.json 2>/dev/null || echo 'not run')"
            echo
            echo '```json'
            python3 - <<'PY'
          import glob, json, os
          out = {}
          for p in sorted(glob.glob("runs/m2pilot/teacher/seed*/policies/*/summary.json")):
              s = json.load(open(p))
              out[p.split("/")[3]] = {k: s[k] for k in ("n_sessions", "mean_score", "success_rate", "avg_questions")}
          c = "runs/m2pilot/teacher/costs.json"
          if os.path.exists(c):
              d = json.load(open(c))
              out["stopped"] = d.get("stopped")
              out["api_calls_this_run"] = sum(v.get("api_calls", 0) for v in d["this_run"].values())
          print(json.dumps(out, ensure_ascii=False, indent=1))
          PY
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
